<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库助手</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --border: #e2e8f0;
    --primary: #4f46e5; --primary-hover: #4338ca;
    --text: #1e293b; --text-secondary: #64748b;
    --success: #10b981; --danger: #ef4444;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Upload */
  .upload-zone { margin: 16px; padding: 24px 16px; border: 2px dashed var(--border); border-radius: var(--radius); text-align: center; cursor: pointer; transition: .2s; }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: #eef2ff; }
  .upload-zone p { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
  .upload-zone .icon { font-size: 28px; }

  /* Doc list */
  .doc-section { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .doc-section h3 { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  .doc-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 13px; }
  .doc-item:hover { background: #f1f5f9; }
  .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-item .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; opacity: 0; padding: 2px 6px; }
  .doc-item:hover .del-btn { opacity: 1; }

  /* Upload progress */
  .upload-progress { padding: 0 16px; }
  .upload-file { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; color: var(--text-secondary); }
  .upload-file .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
  .upload-file.done .spinner { border-color: var(--success); border-top-color: var(--success); animation: none; }
  .upload-file.fail .spinner { border-color: var(--danger); border-top-color: var(--danger); animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Chat */
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .msg { display: flex; margin-bottom: 16px; gap: 10px; max-width: 80%; }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }
  .msg .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .msg.assistant .avatar { background: var(--primary); color: #fff; }
  .msg.user .avatar { background: #e2e8f0; }
  .msg .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--border); border-radius: 12px 12px 12px 4px; }
  .msg.user .bubble { background: var(--primary); color: #fff; border-radius: 12px 12px 4px 12px; }

  /* Sources */
  .sources { margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
  .sources summary { cursor: pointer; user-select: none; }
  .sources .src-item { padding: 4px 0; border-bottom: 1px solid #f1f5f9; }
  .sources .src-name { font-weight: 500; color: var(--primary); }
  .sources .src-preview { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; display: inline-block; }

  /* Input */
  .input-bar { padding: 16px 24px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-bar textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; min-height: 44px; max-height: 120px; }
  .input-bar textarea:focus { border-color: var(--primary); }
  .input-bar button { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: 0 20px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .input-bar button:hover { background: var(--primary-hover); }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }

  /* Welcome */
  .welcome { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-secondary); font-size: 15px; }
  .welcome .inner { text-align: center; }
  .welcome .inner .icon { font-size: 48px; margin-bottom: 12px; }

  /* Responsive */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .msg { max-width: 95%; }
  }
</style>
</head>
<body>

<header>
  <h1>知识库助手</h1>
  <span class="status" id="statusText">就绪</span>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">+</div>
      <p>点击或拖拽上传文档<br><small>支持 PDF / DOCX / MD / TXT</small></p>
      <input type="file" id="fileInput" hidden multiple accept=".pdf,.docx,.doc,.md,.txt">
    </div>
    <div class="upload-progress" id="uploadProgress"></div>
    <div class="doc-section">
      <h3>已上传文档</h3>
      <div id="docList"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="main">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="inner">
          <div class="icon">&#128218;</div>
          <p>上传文档后开始提问</p>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="questionInput" placeholder="输入问题..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendQuestion()">发送</button>
    </div>
  </div>
</div>

<script>
const API = '';
let isSending = false;

// ---- Upload ----
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const uploadProgress = document.getElementById('uploadProgress');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

async function handleFiles(files) {
  for (const file of files) {
    const el = document.createElement('div');
    el.className = 'upload-file';
    el.innerHTML = `<div class="spinner"></div><span>${file.name}</span>`;
    uploadProgress.appendChild(el);

    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`${API}/api/documents/upload`, { method: 'POST', body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }
      const data = await res.json();
      el.className = 'upload-file done';
      el.querySelector('span').textContent = `${file.name} (${data.chunk_count} 块)`;
    } catch (e) {
      el.className = 'upload-file fail';
      el.querySelector('span').textContent = `${file.name}: ${e.message}`;
    }
  }
  loadDocList();
  setTimeout(() => { uploadProgress.innerHTML = ''; }, 3000);
}

// ---- Doc List ----
async function loadDocList() {
  try {
    const res = await fetch(`${API}/api/documents/`);
    const docs = await res.json();
    const el = document.getElementById('docList');
    if (!docs.length) { el.innerHTML = '<p style="font-size:12px;color:#94a3b8;padding:8px 10px;">暂无文档</p>'; return; }
    el.innerHTML = docs.map(d => `
      <div class="doc-item">
        <span class="name" title="${d.filename}">${d.filename}</span>
        <button class="del-btn" onclick="deleteDoc('${encodeURIComponent(d.filename)}')" title="删除">&times;</button>
      </div>
    `).join('');
  } catch {}
}

async function deleteDoc(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (!confirm(`删除「${name}」？`)) return;
  await fetch(`${API}/api/documents/${encodedName}`, { method: 'DELETE' });
  loadDocList();
}

// ---- Chat ----
const messagesEl = document.getElementById('messages');
const questionInput = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');

questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
questionInput.addEventListener('input', () => {
  questionInput.style.height = 'auto';
  questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
});

function addMsg(role, html) {
  document.getElementById('welcome')?.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = role === 'user' ? '我' : 'AI';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${html}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderSources(sources) {
  if (!sources || !sources.length) return '';
  let html = '<div class="sources"><details><summary>参考来源 (' + sources.length + ')</summary>';
  sources.forEach((s, i) => {
    const name = s.source || '未知';
    const preview = (s.content || '').slice(0, 60).replace(/</g, '&lt;');
    html += `<div class="src-item">[${i + 1}] <span class="src-name">${name}</span>: <span class="src-preview" title="${s.content?.replace(/"/g, '&quot;')}">${preview}...</span></div>`;
  });
  html += '</details></div>';
  return html;
}

async function sendQuestion() {
  const q = questionInput.value.trim();
  if (!q || isSending) return;

  isSending = true;
  sendBtn.disabled = true;
  document.getElementById('statusText').textContent = '思考中...';

  addMsg('user', q.replace(/</g, '&lt;').replace(/\n/g, '<br>'));
  questionInput.value = '';
  questionInput.style.height = 'auto';

  const aiMsg = addMsg('assistant', '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;"></span>');
  const bubble = aiMsg.querySelector('.bubble');

  let answerText = '';
  let thinkingText = '';
  let sources = [];

  try {
    const res = await fetch(`${API}/api/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop(); // 保留不完整的最后一行

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        if (!jsonStr) continue;

        let evt;
        try { evt = JSON.parse(jsonStr); } catch { continue; }

        if (evt.event === 'sources') {
          sources = evt.data;
          document.getElementById('statusText').textContent = '回答中...';
        } else if (evt.event === 'thinking') {
          thinkingText += evt.data;
          const thinkHtml = thinkingText.replace(/</g, '&lt;').replace(/\n/g, '<br>');
          const thinkingEl = bubble.querySelector('.thinking-section');
          if (thinkingEl) {
            thinkingEl.querySelector('.thinking-content').innerHTML = thinkHtml;
          } else {
            bubble.innerHTML = `<details class="thinking-section" open><summary style="cursor:pointer;color:#f59e0b;font-size:13px;">&#128161; 思考过程</summary><div class="thinking-content" style="font-size:13px;color:#64748b;padding:6px 0;border-left:2px solid #f59e0b;padding-left:10px;margin:6px 0;">${thinkHtml}</div></details><span class="answer-text"></span>`;
          }
        } else if (evt.event === 'content') {
          answerText += evt.data;
          const answerHtml = answerText.replace(/</g, '&lt;').replace(/\n/g, '<br>');
          let answerEl = bubble.querySelector('.answer-text');
          if (!answerEl) {
            bubble.innerHTML = (thinkingText ? '' : '') + `<span class="answer-text">${answerHtml}</span>`;
            answerEl = bubble.querySelector('.answer-text');
          }
          answerEl.innerHTML = answerHtml;
        } else if (evt.event === 'done') {
          // 追加参考来源
          if (sources.length) {
            bubble.innerHTML += renderSources(sources);
          }
        }
      }
    }
  } catch (e) {
    bubble.innerHTML = `<span style="color:var(--danger)">请求失败: ${e.message}</span>`;
  }

  isSending = false;
  sendBtn.disabled = false;
  document.getElementById('statusText').textContent = '就绪';
}

// Init
loadDocList();
</script>
</body>
</html>
